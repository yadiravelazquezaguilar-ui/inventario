name: PHP CI

on:
  pull_request:
    branches:
      - main

jobs:
  revisar-proyecto:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: Verificar archivos requeridos
        run: |
          test -f index.php
          test -f guardar.php
          test -f config/conexion.php

      - name: Revisar sintaxis de todos los archivos PHP
        run: |
          find . -name "*.php" -print0 | xargs -0 -n1 php -l

      - name: Ejecutar pruebas funcionales
        run: php tests/validacion_nombre.php
